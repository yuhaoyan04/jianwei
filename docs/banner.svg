<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="见微 / Jianwei banner">
  <rect width="1200" height="360" rx="16" fill="#f6f2ea"/>
  <rect x="8" y="8" width="1184" height="344" rx="12" fill="none" stroke="#e6dfcf" stroke-width="1.5"/>

  <!-- logo mark: ring + dot -->
  <g transform="translate(600,96)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#9c9387" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="5.5" fill="#9c4a2a"/>
  </g>

  <!-- wordmark 见微 -->
  <text x="600" y="210" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Noto Serif SC, Georgia, serif" font-size="96" font-weight="600" letter-spacing="14" fill="#241f18">见<tspan fill="#9c4a2a">微</tspan></text>

  <!-- romanization -->
  <text x="600" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15" letter-spacing="12" fill="#9c9387">JIANWEI</text>

  <!-- divider -->
  <line x1="540" y1="278" x2="660" y2="278" stroke="#d6cdb9" stroke-width="1.2"/>

  <!-- slogan -->
  <text x="600" y="312" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Noto Serif SC, Georgia, serif" font-size="20" letter-spacing="2" fill="#6b6357">从细节，看见世界的结构。</text>
</svg>
